# Render Free — pilih Worker (bukan Web Service) supaya polling tidak tidur.
# Isi BOT_TOKEN di dashboard Render > Environment.
services:
  - type: worker
    name: telegram-imap-checker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_FILE_LINES
        value: "3000"
      - key: BULK_CONCURRENCY
        value: "10"
